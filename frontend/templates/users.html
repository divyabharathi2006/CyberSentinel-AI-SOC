{% extends "base.html" %}{% block title %}Users · CyberSentinel{% endblock %}{% block page_id %}users{% endblock %}{% block heading %}User Administration{% endblock %}
{% block content %}<div class="page-intro"><p>Provision analyst accounts with least-privilege roles and strong passwords.</p><button class="btn btn-primary" id="toggle-user-form">＋ Add user</button></div><section class="panel" id="user-create-panel" hidden><form id="user-form" class="form-grid"><label>Username<input class="form-control" name="username" maxlength="80" required></label><label>Email<input class="form-control" type="email" name="email" maxlength="254" required></label><label>Role<select class="form-select" name="role">{% for value in site_options.user_roles %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></label><label>Password<input class="form-control" type="password" name="password" minlength="12" required></label><div><button class="btn btn-primary">Create account</button></div></form></section><section class="panel"><div id="users-table" class="table-wrap"><div class="loading">Loading users…</div></div></section>{% endblock %}
