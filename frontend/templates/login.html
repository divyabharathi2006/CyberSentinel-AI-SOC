<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CyberSentinel AI SOC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/soc.css') }}" rel="stylesheet">
</head>
<body class="login-page" data-page="login">
  <main class="login-panel">
    <a class="brand login-brand" href="/login"><span class="brand-mark">CS</span><span>CyberSentinel<small>AI Security Operations</small></span></a>
    <div class="eyebrow mt-5">SECURE ANALYST ACCESS</div>
    <h1>Welcome back</h1><p class="muted">Sign in to access your authorized SOC workspace.</p>
    <form id="login-form">
      <label for="username" class="form-label">Username</label><input id="username" name="username" class="form-control" autocomplete="username" required maxlength="80">
      <label for="password" class="form-label mt-3">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required maxlength="256">
      <button class="btn btn-primary w-100 mt-4" type="submit">Sign in securely</button>
      <div id="login-error" class="form-error mt-3" role="alert"></div>
    </form>
    <p class="login-note">Accounts are provisioned by a system administrator. No default credentials are created.</p>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
